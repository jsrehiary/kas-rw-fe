<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Transaction type colors */
    .type-pemasukan td { color: #198754; }
    .type-pengeluaran td { color: #dc3545; }
    /* Saldo colors */
    .saldo-positive { color: #198754; }
    .saldo-negative { color: #dc3545; }
  </style>
  <title>Kas RW Dashboard</title>
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- HEADER -->
    <div class="mb-4 text-center">
      <h1 class="fw-bold">Dashboard Kas RW</h1>
      <p class="text-muted">Sistem Manajemen Keuangan RW</p>
    </div>

    <!-- SALDO CARD -->
    <div class="card shadow-sm mb-4">
      <div class="card-body text-center">
        <h5 class="card-title text-secondary">Total Saldo</h5>
        <h2 class="text-success fw-bold" id="saldo">Rp 0</h2>
      </div>
    </div>

    <!-- GRID -->
    <div class="row g-4">

      <!-- FORM -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Tambah Transaksi</h5>
            <form id="transactionForm" class="mt-3">
              <table class="table table-borderless align-middle">
                <tbody>
                  <tr>
                    <td><label class="form-label">Jenis</label></td>
                    <td>
                      <div class="dropdown w-100">
                        <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="jenisDropdown"
                          data-bs-toggle="dropdown" aria-expanded="false">
                          Pilih Jenis
                        </button>
                        <ul class="dropdown-menu w-100" aria-labelledby="jenisDropdown">
                          <li><a class="dropdown-item" href="#" data-value="pemasukan">Pemasukan</a></li>
                          <li><a class="dropdown-item" href="#" data-value="pengeluaran">Pengeluaran</a></li>
                        </ul>
                      </div>
                      <input type="hidden" id="jenis" required>
                    </td>
                  </tr>
                  <tr>
                    <td><label for="tanggal" class="form-label">Tanggal</label></td>
                    <td><input type="date" id="tanggal" class="form-control" required /></td>
                  </tr>
                  <tr>
                    <td><label for="nominal" class="form-label">Nominal</label></td>
                    <td>
                      <div class="input-group">
                        <span class="input-group-text">Rp.</span>
                        <input type="number" id="nominal" class="form-control" placeholder="Nominal" required />
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td><label for="keterangan" class="form-label">Keterangan</label></td>
                    <td><input type="text" id="keterangan" class="form-control" placeholder="Keterangan" />
                    </td>
                  </tr>
                  <tr>
                    <td><input type="hidden" id="transactionId"></td>
                    <td>
                      <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold">
                          Simpan Transaksi
                        </button>
                        <button type="button" class="btn btn-secondary fw-bold d-none" id="cancelEditButton">
                          Batal Edit
                        </button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </form>
          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Riwayat Transaksi</h5>
            <div class="table-responsive mt-3">
              <table class="table table-striped align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Tanggal</th>
                    <th>Jenis</th>
                    <th>Keterangan</th>
                    <th>Nominal</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="transactionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const saldoElement = document.getElementById("saldo");
    const tableBody = document.getElementById("transactionTable");
    const form = document.getElementById("transactionForm");
    const tanggalElement = document.getElementById("tanggal");
    const jenisDropdownBtn = document.getElementById("jenisDropdown");
    const jenisInput = document.getElementById("jenis");
    const transactionIdInput = document.getElementById("transactionId");
    const cancelEditButton = document.getElementById("cancelEditButton");
    const submitButton = form.querySelector('button[type="submit"]');

    let transactions = [];

    tanggalElement.value = new Date().toISOString().split('T')[0];

    function resetForm() {
      form.reset();
      transactionIdInput.value = "";
      jenisInput.value = "";
      jenisDropdownBtn.textContent = "Pilih Jenis";
      submitButton.textContent = "Simpan Transaksi";
      cancelEditButton.classList.add('d-none');
      tanggalElement.value = new Date().toISOString().split('T')[0];
    }

    function setJenis(value, text) {
      jenisInput.value = value;
      jenisDropdownBtn.textContent = text;
    }

    function fillForm(trx) {
      transactionIdInput.value = trx.id;
      tanggalElement.value = new Date(trx.tanggal).toISOString().split('T')[0];
      setJenis(trx.jenis, trx.jenis === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran');
      document.getElementById('nominal').value = trx.jumlah;
      document.getElementById('keterangan').value = trx.keterangan;
      submitButton.textContent = 'Perbarui Transaksi';
      cancelEditButton.classList.remove('d-none');
    }

    async function fetchTransactions() {
      try {
        const response = await fetch('/api/transaksi');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        transactions = await response.json();
        renderTransactions();
      } catch (error) {
        console.error("Error fetching transactions:", error);
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Gagal memuat transaksi. Periksa koneksi ke server.'
        });
      }
    }

    function renderTransactions() {
      tableBody.innerHTML = "";
      let saldo = 0;

      transactions.forEach((trx) => {
        saldo += trx.jenis === "pemasukan" ? trx.jumlah : -trx.jumlah;

        const row = document.createElement("tr");
        row.classList.add(trx.jenis === 'pemasukan' ? 'type-pemasukan' : 'type-pengeluaran');
        row.innerHTML = `
          <td>${new Date(trx.tanggal).toLocaleDateString("id-ID")}</td>
          <td>${trx.jenis}</td>
          <td>${trx.keterangan}</td>
          <td><span class="badge ${trx.jenis === 'pemasukan' ? 'bg-success text-light' : 'bg-danger text-light'}">Rp ${trx.jumlah.toLocaleString("id-ID")}</span></td>
          <td class="text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-primary me-2" data-action="edit" data-id="${trx.id}">Edit</button>
            <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${trx.id}">Hapus</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

      saldoElement.innerText = "Rp " + saldo.toLocaleString("id-ID");
      saldoElement.className = saldo >= 0 ? 'saldo-positive' : 'saldo-negative';
    }

    // Handle dropdown selection
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', function (e) {
        e.preventDefault();
        const value = this.getAttribute('data-value');
        const text = this.textContent;
        setJenis(value, text);
      });
    });

    tableBody.addEventListener('click', async function (e) {
      const button = e.target.closest('button[data-action]');
      if (!button) return;

      const action = button.getAttribute('data-action');
      const id = button.getAttribute('data-id');
      const transaction = transactions.find(t => t.id === Number(id));

      if (action === 'edit' && transaction) {
        fillForm(transaction);
      }

      if (action === 'delete') {
        const result = await Swal.fire({
          icon: 'warning',
          title: 'Hapus Transaksi',
          text: 'Apakah Anda yakin ingin menghapus transaksi ini?',
          showCancelButton: true,
          confirmButtonText: 'Ya, hapus',
          cancelButtonText: 'Batal',
        });

        if (result.isConfirmed) {
          try {
            const response = await fetch(`/api/transaksi/${id}`, {
              method: 'DELETE',
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            await fetchTransactions();
            Swal.fire({ icon: 'success', title: 'Dihapus', text: 'Transaksi berhasil dihapus.' });
          } catch (error) {
            console.error('Error deleting transaction:', error);
            Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal menghapus transaksi.' });
          }
        }
      }
    });

    cancelEditButton.addEventListener('click', function () {
      resetForm();
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const tanggal = document.getElementById("tanggal").value;
      const jenis = document.getElementById("jenis").value;
      const jumlah = parseFloat(document.getElementById("nominal").value);
      let keterangan = document.getElementById("keterangan").value;

      if (!jenis) {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: 'Silakan pilih jenis transaksi terlebih dahulu.'
        });
        return;
      }

      if (jumlah <= 0 || Number.isNaN(jumlah)) {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: 'Nominal harus lebih besar dari nol.'
        });
        return;
      }

      if (!keterangan.trim()) {
        keterangan = "-";
      }

      const payload = { tanggal, jenis, jumlah, keterangan };
      const transactionId = transactionIdInput.value;

      try {
        const response = await fetch(transactionId ? `/api/transaksi/${transactionId}` : '/api/transaksi', {
          method: transactionId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
        }

        resetForm();
        await fetchTransactions();
        Swal.fire({
          icon: 'success',
          title: transactionId ? 'Diperbarui' : 'Tersimpan',
          text: transactionId ? 'Transaksi berhasil diperbarui.' : 'Transaksi berhasil disimpan.'
        });
      } catch (error) {
        console.error("Error creating transaction:", error);
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Gagal menyimpan transaksi.'
        });
      }
    });

    // Load transactions on page load
    fetchTransactions();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
