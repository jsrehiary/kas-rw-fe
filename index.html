<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Kas RW Dashboard</title>
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- HEADER -->
    <div class="mb-4 text-center">
      <h1 class="fw-bold">Dashboard Kas RW</h1>
      <p class="text-muted">Sistem Manajemen Keuangan RW</p>
    </div>

    <!-- SALDO CARD -->
    <div class="card shadow-sm mb-4">
      <div class="card-body text-center">
        <h5 class="card-title text-secondary">Total Saldo</h5>
        <h2 class="text-success fw-bold" id="saldo">Rp 0</h2>
      </div>
    </div>

    <!-- GRID -->
    <div class="row g-4">

      <!-- FORM -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Tambah Transaksi</h5>
            <form id="transactionForm" class="mt-3">
              <table class="table table-borderless align-middle">
                <tbody>
                  <tr>
                    <td><label class="form-label">Jenis</label></td>
                    <td>
                      <div class="dropdown w-100">
                        <button class="btn btn-secondary dropdown-toggle w-100" type="button" id="jenisDropdown"
                          data-bs-toggle="dropdown" aria-expanded="false">
                          Pilih Jenis
                        </button>
                        <ul class="dropdown-menu w-100" aria-labelledby="jenisDropdown">
                          <li><a class="dropdown-item" href="#" data-value="Pemasukan">Pemasukan</a></li>
                          <li><a class="dropdown-item" href="#" data-value="Pengeluaran">Pengeluaran</a></li>
                        </ul>
                      </div>
                      <input type="hidden" id="jenis" required>
                    </td>
                  </tr>
                  <tr>
                    <td><label for="nominal" class="form-label">Nominal</label></td>
                    <td><input type="number" id="nominal" class="form-control" placeholder="Nominal" required /></td>
                  </tr>
                  <tr>
                    <td><label for="keterangan" class="form-label">Keterangan</label></td>
                    <td><input type="text" id="keterangan" class="form-control" placeholder="Keterangan" />
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2">
                      <button type="submit" class="btn btn-primary w-100 fw-bold">
                        Simpan Transaksi
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </form>
          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Riwayat Transaksi</h5>
            <div class="table-responsive mt-3">
              <table class="table table-striped align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Jenis</th>
                    <th>Keterangan</th>
                    <th>Nominal</th>
                  </tr>
                </thead>
                <tbody id="transactionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const saldoElement = document.getElementById("saldo");
    const tableBody = document.getElementById("transactionTable");
    const form = document.getElementById("transactionForm");

    let transactions = [
      { jenis: "Pemasukan", nominal: 500000, keterangan: "Iuran Warga" },
      { jenis: "Pengeluaran", nominal: 150000, keterangan: "Perbaikan Lampu" }
    ];

    function renderTransactions() {
      tableBody.innerHTML = "";
      let saldo = 0;

      transactions.forEach((trx) => {
        saldo += trx.jenis === "Pemasukan" ? trx.nominal : -trx.nominal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="${trx.jenis === 'Pemasukan' ? 'text-success fw-bold' : 'text-danger fw-bold'}">
            ${trx.jenis}
          </td>
          <td>${trx.keterangan}</td>
          <td>Rp ${trx.nominal.toLocaleString("id-ID")}</td>
        `;
        tableBody.appendChild(row);
      });

      saldoElement.innerText = "Rp " + saldo.toLocaleString("id-ID");
    }

    // Handle dropdown selection
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', function (e) {
        e.preventDefault();
        const value = this.getAttribute('data-value');
        const text = this.textContent;

        document.getElementById('jenisDropdown').textContent = text;
        document.getElementById('jenis').value = value;
      });
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const jenis = document.getElementById("jenis").value;
      const nominal = parseInt(document.getElementById("nominal").value);
      let keterangan = document.getElementById("keterangan").value;

      if (!jenis) {
        alert("Silakan pilih jenis transaksi terlebih dahulu.");
        return;
      }

      if (!keterangan.trim()) {
        keterangan = "-";
      }


      transactions.unshift({ jenis, nominal, keterangan });
      renderTransactions();
      form.reset();
      document.getElementById('jenisDropdown').textContent = "Pilih Jenis";
    });

    renderTransactions();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
